[project]
name = "hermes-domain"
version = "0.1.0"
description = "Hermes Workspace OS — framework-independent domain layer (entities, value objects, events)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_domain"]
