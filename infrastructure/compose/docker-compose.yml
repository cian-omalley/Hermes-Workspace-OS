# Hermes Workspace OS — local development stack.
# Brings up the datastores (source of record + derived stores + object storage) and the
# application services. Milestone 1 wires api/web/worker + all datastores with health
# checks. Reads configuration from the repo-root `.env` (see config/.env.example).
#
# Usage:  just up   (or)   docker compose -f infrastructure/compose/docker-compose.yml up -d
# Docs:   docs/PROJECT_BIBLE/08_Development/Deployment.md

name: hermes

services:
  # ---- Datastores -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-neo4j}
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  meilisearch:
    image: getmeili/meilisearch:v1.9
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-change-me-meili-master-key}
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: ["meili_data:/meili_data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hermes}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- Application services --------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: ["../../.env"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: ["../../.env"]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    env_file: ["../../.env"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: ["api"]

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  qdrant_data:
  meili_data:
  minio_data:
