[project]
name = "hermes-worker"
version = "0.1.0"
description = "Hermes Workspace OS — Celery workers (ingestion, sync, indexing)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "celery>=5.4",
    "redis>=5.0",
    "pydantic-settings>=2.3",
    "hermes-domain",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.uv.sources]
hermes-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_worker"]
